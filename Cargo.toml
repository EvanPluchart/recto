[workspace]
resolver = "3"
members = ["crates/recto-core", "crates/recto-render", "crates/recto-ocr", "crates/recto-app", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
authors = ["Evan Pluchart"]
repository = "https://github.com/EvanPluchart/recto"

# GPUI and PDFium are pinned exactly; upgrade them only on purpose, in a dedicated commit.
# The PDFium binary itself is pinned in xtask (PDFIUM_RELEASE) and must match the `pdfium_*` API feature below.
# Cargo.lock holds libc at 0.2.189: 0.2.190 dropped `ENOATTR` on Linux, which breaks `xattr 0.2.3` (pulled by gpui).
# Do not `cargo update` libc past it until gpui stops depending on xattr 0.2.
[workspace.dependencies]
recto-core = { path = "crates/recto-core" }
recto-render = { path = "crates/recto-render" }
recto-ocr = { path = "crates/recto-ocr" }
gpui = "=0.2.2"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"] }
lopdf = { version = "0.46.0", default-features = false }
flume = "0.12.0"
anyhow = "1.0.104"
thiserror = "2.0.21"
pdf-writer = "0.15.0"
image = { version = "0.25.10", default-features = false }
getrandom = "0.4.3"

# OCR is unusably slow unoptimised, even in debug builds and tests.
[profile.dev.package.ocrs]
opt-level = 3
[profile.dev.package.rten]
opt-level = 3
[profile.dev.package.rten-base]
opt-level = 3
[profile.dev.package.rten-gemm]
opt-level = 3
[profile.dev.package.rten-imageproc]
opt-level = 3
[profile.dev.package.rten-parallel]
opt-level = 3
[profile.dev.package.rten-simd]
opt-level = 3
[profile.dev.package.rten-tensor]
opt-level = 3
[profile.dev.package.rten-vecmath]
opt-level = 3
