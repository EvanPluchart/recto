[package]
name = "recto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Recto: a cross-platform PDF viewer and editor"

[[bin]]
name = "recto"
path = "src/main.rs"

[dependencies]
recto-core.workspace = true
recto-render.workspace = true
recto-ocr.workspace = true
fontdb.workspace = true
sys-locale = "0.3.2"
anyhow.workspace = true
flume.workspace = true
gpui.workspace = true
image = { workspace = true, features = ["png", "jpeg"] }

[build-dependencies]
embed-resource = "3.0.12"

# Printing on Windows: the print dialog and GDI. The same version as GPUI's, so it is built once.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_Controls_Dialogs"] }
